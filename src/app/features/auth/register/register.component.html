<div class="register-container">
  <h1>Registro</h1>
  <form [formGroup]="registerForm" (ngSubmit)="onSubmit()">
    <div>
      <input type="text" formControlName="username" placeholder="Usuario" />
      <div *ngIf="isFieldInvalid('username')" class="error">Usuario requerido</div>
    </div>
    <div>
      <input type="email" formControlName="email" placeholder="Email" />
      <div *ngIf="isFieldInvalid('email')" class="error">Email inválido</div>
    </div>
    <div>
      <input type="password" formControlName="password" placeholder="Contraseña" />
      <div *ngIf="isFieldInvalid('password')" class="error">Contraseña inválida</div>
    </div>
    <button type="submit" [disabled]="registerForm.invalid || loading">
      <span *ngIf="!loading">Registrarse</span>
      <span *ngIf="loading">Registrando...</span>
    </button>
  </form>
  <div *ngIf="successMessage" class="success-message">{{ successMessage }}</div>
  <div *ngIf="errorMessage" class="error-message">{{ errorMessage }}</div>
  <div style="margin-top:1rem;">
    <a routerLink="/login">¿Ya tienes cuenta? Inicia sesión</a>
  </div>
</div>
