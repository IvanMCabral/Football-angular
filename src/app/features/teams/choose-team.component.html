
<div class="choose-team-container">
  <h1>Elegir equipo</h1>
  <div *ngIf="loading">Cargando equipos...</div>
  <div *ngIf="!loading && errorMessage" class="error-message">{{ errorMessage }}</div>

  <ul *ngIf="!loading && !errorMessage && teams.length">
    <li #teamRow *ngFor="let team of teams" (click)="chooseTeam(team)" [class.selected]="selectedTeam && selectedTeam.id === team.id">
      <button type="button" class="team-option" [attr.aria-pressed]="selectedTeam?.id === team.id"><strong>{{ team.name }}</strong>

      <span *ngIf="team.country"> · {{ team.country }}</span></button>
    </li>
  </ul>
  <div *ngIf="!loading && !errorMessage && !teams.length">No hay equipos disponibles.</div>
  <button [disabled]="!selectedTeam || saving" (click)="assignTeam()">Confirmar selección</button>
  <div *ngIf="successMessage" class="success-message">{{ successMessage }}</div>
</div>
<app-client-http-diagnostics-panel *ngIf="showClientHttpDiagnostics"></app-client-http-diagnostics-panel>
