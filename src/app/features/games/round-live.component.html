<div class="round-live-container" *ngIf="vm$ | async as vm">

  <div class="header">
    <h2>Fecha {{ vm.roundNumber }} - En Vivo</h2>
    <span *ngIf="vm.byeTeam" class="bye-badge">BYE: {{ vm.byeTeam }}</span>
    <div class="controls">
      <button *ngIf="!vm.allFinished && !vm.isRoundPaused" (click)="pauseAll()" class="btn btn-pause">⏸️ Pausar Todos</button>
      <button *ngIf="!vm.allFinished && vm.isRoundPaused" (click)="resumeAll()" class="btn btn-resume">▶️ Reanudar Todos</button>
      <a [routerLink]="['/games', vm.gameId]" class="btn btn-back">Volver</a>
    </div>
  </div>

  <div *ngIf="vm.errorMsg" class="error">{{ vm.errorMsg }}</div>

  <!-- V24D11 UX-5: tu partido destacado primero, los demas debajo con divider -->
  <div *ngIf="userMatch" class="user-match-section">
    <h3 class="section-title">⭐ Tu partido</h3>
    <app-match-card
      [match]="userMatch.match"
      [state]="userMatch.state"
      [isUserMatch]="true"
      [homeTeamName]="getTeamName(userMatch.match.homeTeamId, vm.teamNameMap)"
      [awayTeamName]="getTeamName(userMatch.match.awayTeamId, vm.teamNameMap)"
      (tacticChange)="onTacticChange(userMatch.match, $event)">
    </app-match-card>
  </div>

  <div *ngIf="otherMatches.length" class="other-matches-section">
    <h3 class="section-title">Otros partidos</h3>
    <div class="matches-grid">
      <app-match-card
        *ngFor="let rm of otherMatches"
        [match]="rm.match"
        [state]="rm.state"
        [isUserMatch]="false"
        [homeTeamName]="getTeamName(rm.match.homeTeamId, vm.teamNameMap)"
        [awayTeamName]="getTeamName(rm.match.awayTeamId, vm.teamNameMap)"
        (tacticChange)="onTacticChange(rm.match, $event)">
      </app-match-card>
    </div>
  </div>

  <div class="footer" *ngIf="vm.allFinished">
    <h3>¡Fecha {{ vm.roundNumber }} Finalizada!</h3>
    <button (click)="goToRoundSummary()" class="btn btn-primary btn-large">
      📋 Ver Resumen de Fecha
    </button>
  </div>
</div>
