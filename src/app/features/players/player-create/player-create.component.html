<div class="container">
  <h2>Crear jugadores para la carrera</h2>
  <div class="random-section">
    <h3>🎲 Generar jugadores aleatorios</h3>
    <div class="random-controls">
      <label for="random-player-count">Cantidad de jugadores (máximo {{ MAX_RANDOM_PLAYERS }})</label>
      <input id="random-player-count" type="number" [(ngModel)]="randomCount" min="1" [max]="MAX_RANDOM_PLAYERS" class="form-control-inline" />
      <button type="button" (click)="createRandomBatch()" class="btn-random">
        Generar {{ randomCount }} jugador{{ randomCount > 1 ? 'es' : '' }} aleatorio{{ randomCount > 1 ? 's' : '' }}
      </button>
      <button type="button" (click)="createRandom()" class="btn-random">
        Generar 1 jugador aleatorio
      </button>
    </div>
    <ng-container *ngIf="randomPlayers$ | async as randomPlayers">
      <div *ngIf="randomPlayers" class="success">
        <span class="icon">✅</span>
        {{ randomPlayers.count ? (randomPlayers.count + ' jugadores generados correctamente.') : 'Jugador aleatorio generado correctamente.' }}
      </div>
    </ng-container>
  </div>
  <hr/>
  <h3>O crear jugador personalizado</h3>
  <form [formGroup]="playerForm" (ngSubmit)="onSubmit()">
    <div class="row">
      <div class="form-group">
        <label for="player-name">Nombre *</label>
        <input type="text" id="player-name" formControlName="name" class="form-control" />
      </div>
      <div class="form-group">
        <label for="player-age">Edad *</label>
        <input type="number" id="player-age" formControlName="age" class="form-control" />
      </div>
    </div>
    <div class="form-group">
      <label for="player-position">Posicion *</label>
      <select id="player-position" formControlName="position" class="form-control">
        <option value="GK">Arquero</option>
        <option value="DEF">Defensor</option>
        <option value="MID">Mediocampista</option>
        <option value="WINGER">Extremo</option>
        <option value="ATT">Delantero</option>
      </select>
    </div>
    <div class="stats-grid">
      <div class="form-group">
        <label for="player-attack">Ataque (40-90)</label>
        <input type="number" id="player-attack" formControlName="attack" class="form-control" min="40" max="90" />
      </div>
      <div class="form-group">
        <label for="player-defense">Defensa (40-90)</label>
        <input type="number" id="player-defense" formControlName="defense" class="form-control" min="40" max="90" />
      </div>
      <div class="form-group">
        <label for="player-technique">Tecnica (40-90)</label>
        <input type="number" id="player-technique" formControlName="technique" class="form-control" min="40" max="90" />
      </div>
      <div class="form-group">
        <label for="player-speed">Velocidad (40-90)</label>
        <input type="number" id="player-speed" formControlName="speed" class="form-control" min="40" max="90" />
      </div>
      <div class="form-group">
        <label for="player-stamina">Resistencia (40-90)</label>
        <input type="number" id="player-stamina" formControlName="stamina" class="form-control" min="40" max="90" />
      </div>
      <div class="form-group">
        <label for="player-mentality">Mentalidad (40-90)</label>
        <input type="number" id="player-mentality" formControlName="mentality" class="form-control" min="40" max="90" />
      </div>
    </div>
    <div class="actions">
      <button type="submit" [disabled]="!playerForm.valid || loading">{{ loading ? 'Creando...' : 'Crear jugador' }}</button>
      <a routerLink="/careers" class="btn-cancel">Volver a Carreras</a>
    </div>
  </form>
  <div *ngIf="errorMessage" class="error">{{ errorMessage }}</div>
  <div *ngIf="successMessage" class="success">{{ successMessage }}</div>
</div>
