<div class="career-status-bar" *ngIf="careerStatus">
  <!-- Temporada -->
  <div class="status-item" *ngIf="careerStatus.season">
    <span class="status-label">Temporada</span>
    <span class="status-value">{{careerStatus.season}}</span>
  </div>
  <div class="status-divider" *ngIf="careerStatus.season"></div>

  <!-- C55.10 Item 4 — División pill prominent (gap A1 reaparecido).
       Same tier-real contract as the dashboard pill: consumes the backend
       label verbatim and picks the CSS class via {@link tierCssClass} so any
       tier (CUARTA, QUINTA, SEXTA, …) renders with the tier-default fallback
       instead of unstyled text. -->
  <div class="status-item status-item-division" *ngIf="careerStatus.userDivision">
    <span class="status-label">División</span>
    <span class="status-division-pill" [class]="tierCssClass(careerStatus.userDivision)">
      {{careerStatus.userDivision}}
    </span>
  </div>
  <div class="status-divider" *ngIf="careerStatus.userDivision"></div>

  <!-- Fase de temporada activa -->
  <ng-container *ngIf="careerStatus.careerPhase !== 'FINISHED'">
    <div class="status-item">
      <span class="status-label">Jornada</span>
      <span class="status-value">{{careerStatus.currentRound}} / {{careerStatus.totalRounds}}</span>
    </div>
    <div class="status-divider"></div>
  </ng-container>

  <!-- Torneo finalizado -->
  <ng-container *ngIf="careerStatus.careerPhase === 'FINISHED'">
    <div class="status-item">
      <span class="status-label">Estado</span>
      <span class="status-value" style="color: #ffd700;">🏆 Temporada Finalizada</span>
    </div>
    <div class="status-divider"></div>
  </ng-container>

  <div class="status-item">
    <span class="status-label">Plantilla</span>
    <span class="status-value">{{careerStatus.squadSize}} / 25</span>
  </div>
  <div class="status-divider"></div>
  <div class="status-item">
    <span class="status-label">Libres</span>
    <span class="status-value">{{careerStatus.freePlayersCount}}</span>
  </div>
  <div class="status-divider"></div>
  <div class="status-item fixture-item">
    <button class="btn-action" (click)="onFixtureClick()" title="Ver calendario de partidos">📅 Ver Fixture</button>
  </div>
  <div class="status-divider"></div>
  <div class="status-item fixture-item">
    <button class="btn-standings" (click)="onStandingsClick()" title="Ver tabla de posiciones">🏆 Tabla</button>
  </div>
  <div class="status-divider"></div>
  <div class="status-item fixture-item">
    <button class="btn-action" (click)="onPalmaresClick()" title="Ver historial de temporadas ganadas">📜 Palmarés</button>
  </div>
  <div class="status-divider"></div>
  <div class="status-item fixture-item">
    <button class="btn-promotions" (click)="onPromotionsClick()" title="Ver ascensos y descensos">📊 Ascensos</button>
  </div>
</div>
