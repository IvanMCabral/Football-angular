<section class="confirm-dialog" [class.warning]="data.tone === 'warning'">
  <div class="icon" aria-hidden="true">
    {{ data.tone === 'warning' ? '⚠️' : '🗑️' }}
  </div>

  <h2 mat-dialog-title>{{ data.title }}</h2>

  <mat-dialog-content>
    <p>{{ data.message }}</p>
  </mat-dialog-content>

  <mat-dialog-actions align="end">
    <button mat-button type="button" (click)="cancel()">
      {{ data.cancelLabel || 'Cancelar' }}
    </button>
    <button
      mat-flat-button
      color="warn"
      type="button"
      data-testid="confirm-action-button"
      (click)="confirm()"
    >
      {{ data.confirmLabel || 'Confirmar' }}
    </button>
  </mat-dialog-actions>
</section>
