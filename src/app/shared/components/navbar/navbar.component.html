<nav class="navbar">
  <div class="navbar-container">
    <a routerLink="/" class="navbar-brand">
      <span class="brand-icon">⚽</span>
      <span class="brand-name">Football Manager</span>
    </a>

    <button class="navbar-toggle" type="button" (click)="toggleMenu()" [class.active]="menuOpen" [attr.aria-expanded]="menuOpen" [attr.aria-label]="menuOpen ? 'Cerrar menú de navegación' : 'Abrir menú de navegación'">
      <span></span>
      <span></span>
      <span></span>
    </button>

    <div class="navbar-menu" [class.active]="menuOpen">
      @if (authStatus$ | async; as authStatus) {
        @if (authStatus === 'authenticated') {
        <a routerLink="/dashboard" routerLinkActive="active" class="nav-link">Inicio</a>
        <a routerLink="/matches" routerLinkActive="active" class="nav-link">Partidos</a>
        <button (click)="logout()" class="nav-button logout">Salir</button>
        } @else if (authStatus === 'anonymous') {
        <a routerLink="/login" routerLinkActive="active" class="nav-link">Ingresar</a>
        <a routerLink="/register" class="nav-button register">Registrarse</a>
        } @else {
        <span class="navbar-session-status" role="status" aria-live="polite">Comprobando sesión…</span>
        }
      }
    </div>
  </div>
</nav>
